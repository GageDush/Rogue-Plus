<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title description"><title id="title">Verification is separate from release</title><desc id="description">Implement and collect evidence, verify acceptance criteria, and record merge and deployment only when separately approved. Verified work can remain on an unreleased branch.</desc><rect width="600" height="450" rx="20" fill="#FBF8F2"/><g font-family="Arial, sans-serif" fill="#202A36"><text x="32" y="66" font-size="30" font-weight="700">Done has evidence.</text><path d="M54 137 L54 322" stroke="#CFC7BC" stroke-width="3"/><circle cx="54" cy="138" r="22" fill="#B63C17"/><text x="54" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">1</text><text x="94" y="131" font-size="24" font-weight="700">Implement</text><text x="94" y="164" font-size="21" fill="#52606B">One task, one reviewable change.</text><circle cx="54" cy="237" r="22" fill="#20754D"/><text x="54" y="245" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">2</text><text x="94" y="230" font-size="24" font-weight="700">Verify</text><text x="94" y="263" font-size="21" fill="#52606B">Criteria, checks and guidance reviewed.</text><circle cx="54" cy="336" r="22" fill="#52606B"/><text x="54" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">3</text><text x="94" y="329" font-size="24" font-weight="700">Release separately</text><text x="94" y="362" font-size="21" fill="#52606B">Record approved merge and deployed SHA.</text><text x="32" y="420" font-size="21" fill="#52606B">Verified on a branch does not mean deployed.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="808" viewBox="0 0 600 808" role="img" aria-labelledby="title description"><title id="title">Rogue+ runs on your device</title><desc id="description">A local file is parsed and normalized in the browser and stored as account state. Pinned reference data and account state feed pure calculations and the companion screens. Independent user Builds and Run state are planned. No save upload or write-back.</desc><rect width="600" height="808" rx="20" fill="#FBF8F2"/><g font-family="Arial, sans-serif" fill="#202A36"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52606B"/></marker></defs><rect x="32" y="30" width="40" height="5" rx="2" fill="#FF6A35"/><text x="32" y="80" font-size="30" font-weight="700">Your device runs Rogue+</text><text x="32" y="118" font-size="22" fill="#52606B">Local by default. Read-only game-save analysis.</text><rect x="32" y="152" width="536" height="104" rx="14" fill="#FFFFFF" stroke="#CFC7BC" /><text x="50" y="189" font-size="23" font-weight="700">01  Choose a local .prsv</text><text x="50" y="226" font-size="20" fill="#52606B">Original game file stays untouched</text><path d="M 300 256 L 300 283" fill="none" stroke="#52606B" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="290" width="536" height="104" rx="14" fill="#FFFFFF" stroke="#CFC7BC" /><text x="50" y="327" font-size="23" font-weight="700">02  Parse, validate, normalize</text><text x="50" y="364" font-size="20" fill="#52606B">Browser processing → local account state</text><path d="M 180 394 L 180 428" fill="none" stroke="#52606B" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="436" width="254" height="104" rx="14" fill="#FFFFFF" stroke="#CFC7BC" /><text x="50" y="473" font-size="23" font-weight="700">Account facts</text><text x="50" y="510" font-size="20" fill="#52606B">Stored on-device</text><rect x="314" y="436" width="254" height="104" rx="14" fill="#FFFFFF" stroke="#CFC7BC" /><text x="332" y="473" font-size="23" font-weight="700">Reference data</text><text x="332" y="510" font-size="20" fill="#52606B">Bundled game data</text><path d="M 159 540 L 240 568" fill="none" stroke="#52606B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 441 540 L 360 568" fill="none" stroke="#52606B" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="576" width="536" height="104" rx="14" fill="#FFFFFF" stroke="#CFC7BC" /><text x="50" y="613" font-size="23" font-weight="700">03  Calculate and display</text><text x="50" y="650" font-size="20" fill="#52606B">Dex · Trainer · History · presets · priorities</text><text x="32" y="720" font-size="22" font-weight="700" fill="#B63C17">Planned: separate Builds + Run repositories</text><text x="32" y="758" font-size="21" fill="#52606B">No save-upload endpoint. No game-save write-back.</text></g></svg>

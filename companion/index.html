<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FBF8F2" />
    <!-- Resolve before styles/React to avoid flashing the wrong theme. -->
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('rogue-plus-appearance-v1');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#090D12' : '#FBF8F2');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-title" content="Rogue+" />
    <meta name="description" content="Rogue+ — a local-first companion for PokéRogue collection tracking, builds, runs, and progression." />
    <title>Rogue Plus — PokéRogue Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

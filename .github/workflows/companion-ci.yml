name: Companion baseline
on:
  push:
    branches: [main, alpha/play-integration, alpha/companion-foundation, design/hybrid-shell-v1]
  pull_request:
jobs:
  companion-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify repository data boundaries
        run: node scripts/validate-repository.mjs
      - name: Install companion dependencies
        run: npm --prefix companion install --no-audit --no-fund
      - name: Test local save schemas and import fixture
        run: npm --prefix companion test
      - name: Test pinned Dex reference extraction
        run: node --test scripts/dex-reference-extractor.test.mjs
      - name: Test offline build and service-worker lifecycle
        run: node --test companion/scripts/offline-lifecycle.check.mjs
      - name: Enforce feature import boundaries
        run: node scripts/check-module-boundaries.mjs
      - name: Validate TypeScript boundaries
        run: npm --prefix companion run typecheck
      - name: Build preserved companion
        run: npm --prefix companion run build
